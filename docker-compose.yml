services:
  music-bot:
    build: .
    container_name: music-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # Раскомментируй, если используешь YTDLP_COOKIES_FILE (см. .env.example) —
      # положи экспортированный cookies.txt в ./secrets/ и укажи в .env
      # YTDLP_COOKIES_FILE=/app/secrets/cookies.txt
      # ОБЯЗАТЕЛЬНО :ro. Без него yt-dlp периодически дозаписывает файл сам
      # (обновляет session-куки) — и при сохранении молча ВЫБРАСЫВАЕТ
      # сессионные куки (без даты истечения), а именно такими обычно
      # экспортируются SID/HSID/SSID/APISID/SAPISID/LOGIN_INFO — то есть
      # ключи авторизации. С каждым вызовом файл понемногу "усыхает" и через
      # десяток запусков аккаунт перестаёт распознаваться как залогиненный
      # (реальный инцидент, см. CLAUDE.md). read-only полностью блокирует
      # эту перезапись; код уже терпим к результирующей ошибке записи
      # (см. run() в src/music/sources/ytdlp.ts) — данные всё равно доходят.
      # - ./secrets/cookies.txt:/app/secrets/cookies.txt:ro
      # Владелец файла на хосте должен быть тем же uid, что и процесс в
      # контейнере (uid 1000, "node") — иначе даже прочитать не сможет:
      # chown 1000:1000 ./secrets/cookies.txt
    # Жёстко ограничиваем 1 ядром/512МБ — так сразу видно на реальном железе,
    # что бот укладывается в целевой бюджет, а не "работает, пока есть запас".
    # cpus/mem_limit — для `docker compose up` вне Swarm; deploy.resources — на случай Swarm/новых Compose V2.
    cpus: "1.0"
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Продлевает YouTube-сессию по расписанию (cron на хосте, см. CLAUDE.md) —
  # НЕ демон, не запускается сам по себе через `docker compose up -d`
  # благодаря profiles: только явным `docker compose --profile cookie-refresh
  # run --rm cookie-refresher`. Между запусками — ноль потребления памяти,
  # headless-браузер живёт лишь секунды самого прогона.
  cookie-refresher:
    build: ./cookie-refresher
    profiles: ["cookie-refresh"]
    environment:
      - STORAGE_STATE_PATH=/data/storageState.json
      - COOKIES_OUT_PATH=/data/cookies.txt
    volumes:
      - ./secrets:/data
    mem_limit: 400m
    cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
